name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        shell: ["bash", "zsh"]
        shell_version: [3.2, 4.0, 5.2, 5.9]
        exclude:
          - shell: bash
            shell_version: 5.9
          - shell: zsh
            shell_version: 3.2
          - shell: zsh
            shell_version: 4.0
          - shell: zsh
            shell_version: 5.2
    uses: ./.github/workflows/common.yml
    with:
      shell: ${{ matrix.shell }}
      shell_version: ${{ matrix.shell_version }}
      os: ubuntu
      os_version: 24.04