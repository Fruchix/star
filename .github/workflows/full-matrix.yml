name: Full Matrix Workflow

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - '**'
  workflow_dispatch:


jobs:
  matrix:
    strategy:
      # see all results even if one fails
      fail-fast: false
      matrix:
        shell: ["bash:3.2", "bash:4.0", "bash:5.2", "zshusers/zsh:5.9"]
    uses: ./.github/workflows/common.yml
    with:
      shell: ${{ matrix.shell }}